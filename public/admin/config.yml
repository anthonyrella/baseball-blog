# Sveltia CMS configuration — https://sveltiacms.app/en/docs
# Mike signs in at /admin. Every save is a commit to GitHub, which triggers a Cloudflare rebuild (~1 min).

backend:
  name: github
  repo: OWNER/REPO # TODO: set to the GitHub repo, e.g. anthonyrella/tales-from-the-ballpark
  branch: main
  base_url: https://sveltia-cms-auth.SUBDOMAIN.workers.dev # TODO: URL of the sveltia-cms-auth Worker
  commit_messages:
    create: 'Add {{collection}} “{{slug}}”'
    update: 'Update {{collection}} “{{slug}}”'
    delete: 'Delete {{collection}} “{{slug}}”'
    uploadMedia: 'Upload “{{path}}”'
    deleteMedia: 'Delete “{{path}}”'

site_url: https://talesfromtheballpark.com
display_url: https://talesfromtheballpark.com
logo_url: /favicon.svg

media_folder: public/images/uploads
public_folder: /images/uploads

collections:
  - name: posts
    label: Writing
    label_singular: Post
    description: Stories, thoughts, articles, and book news.
    folder: src/content/posts
    create: true
    slug: '{{slug}}'
    sortable_fields: [pubDate, title, category]
    view_filters:
      - { label: Stories, field: category, pattern: stories }
      - { label: Thoughts, field: category, pattern: thoughts }
      - { label: Articles, field: category, pattern: articles }
      - { label: Book News, field: category, pattern: book-news }
      - { label: Drafts, field: draft, pattern: true }
    summary: '{{title}} — {{pubDate | date("MMM D, YYYY")}}'
    fields:
      - { name: title, label: Title, widget: string }
      - name: description
        label: Short summary
        hint: One or two sentences. Shown on the home page and in search results.
        widget: text
      - name: category
        label: Category
        widget: select
        default: stories
        options:
          - { label: Stories, value: stories }
          - { label: Thoughts, value: thoughts }
          - { label: Articles, value: articles }
          - { label: Book News, value: book-news }
      - name: pubDate
        label: Publish date
        widget: datetime
        format: YYYY-MM-DD
        time_format: false
      - name: heroImage
        label: Header photo
        widget: image
        required: false
      - name: heroAlt
        label: Photo description
        hint: Describe the photo for readers who can't see it.
        widget: string
        required: false
      - name: tags
        label: Tags
        hint: Players, teams, or topics, e.g. "Yankees", "1950s".
        widget: list
        required: false
      - name: featured
        label: Feature on home page
        widget: boolean
        default: false
        required: false
      - name: draft
        label: Draft (hide from the site)
        widget: boolean
        default: false
        required: false
      - { name: body, label: Post, widget: markdown }

  - name: questions
    label: Q&A
    label_singular: Answer
    description: Reader questions and your answers.
    folder: src/content/questions
    create: true
    slug: '{{fields.question | truncate(60)}}'
    identifier_field: question
    summary: '{{question}}'
    fields:
      - { name: question, label: Question, widget: string }
      - { name: askedBy, label: Asked by, widget: string, default: A reader, hint: 'First name and town is plenty, e.g. "Dave, Hamilton ON".' }
      - name: pubDate
        label: Date answered
        widget: datetime
        format: YYYY-MM-DD
        time_format: false
      - { name: draft, label: Draft (hide from the site), widget: boolean, default: false, required: false }
      - { name: body, label: Answer, widget: markdown }

  - name: books
    label: Books
    label_singular: Book
    folder: src/content/books
    create: true
    slug: '{{slug}}'
    sortable_fields: [order, title]
    summary: '{{title}} ({{status}})'
    fields:
      - { name: title, label: Title, widget: string }
      - { name: subtitle, label: Subtitle, widget: string, required: false }
      - name: status
        label: Status
        widget: select
        default: published
        options:
          - { label: Published, value: published }
          - { label: Coming soon, value: coming-soon }
      - { name: cover, label: Cover image, widget: image, required: false }
      - { name: amazonUrl, label: Amazon link, widget: string, required: false }
      - name: releaseDate
        label: Release date
        widget: datetime
        format: YYYY-MM-DD
        time_format: false
        required: false
      - { name: order, label: Display order, widget: number, default: 1, value_type: int, hint: Lower numbers show first. }
      - { name: body, label: Description, widget: markdown }

  - name: pages
    label: Pages
    files:
      - name: about
        label: About page
        file: src/content/pages/about.md
        fields:
          - { name: title, label: Title, widget: string }
          - { name: intro, label: Short introduction, widget: string, required: false }
          - { name: photo, label: Photo, widget: image, required: false }
          - { name: body, label: Bio, widget: markdown }
